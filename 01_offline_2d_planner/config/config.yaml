# Module 1 Configuration: Offline 2D Planner

offline_planner:
  # A* Algorithm Parameters
  algorithm:
    type: "astar"
    heuristic: "euclidean"  # euclidean or manhattan
    allow_diagonal: true
    
  # Map Configuration
  map:
    resolution: 0.1  # Grid cell size in meters
    origin_x: 0.0
    origin_y: 0.0
    
  # Pathfinding Parameters
  pathfinding:
    smoothing: true
    smoothing_method: "cubic_spline"  # linear or cubic_spline
    distance_threshold: 2.0  # Minimum distance between waypoints
    
  # Vehicle Constraints
  vehicle:
    max_speed: [10.0, 15.0, 20.0, 25.0, 30.0]  # m/s options
    max_acceleration: [2.0, 3.0, 5.0]  # m/s² options
    min_turning_radius: 2.0  # meters
    
  # Route Storage
  storage:
    save_intermediate: true
    compression: true
    
  # Quality Metrics
  quality_check:
    validate_waypoints: true
    check_collisions: true
    smooth_heading_changes: true
